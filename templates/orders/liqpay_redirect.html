{% extends "base.html" %}
{% load static %}

{% block title %}Оплата LiqPay — {{ site_name }}{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/checkout.css' %}">{% endblock %}

{% block content %}
<div class="container">
  <div class="thank-you">
    <h1 class="h1">Переходимо до оплати</h1>
    <p class="thank-you__order">Замовлення №{{ order.order_number }}</p>
    <p class="thank-you__hint">Зачекайте, відкривається сторінка LiqPay…</p>
    <form id="liqpay-checkout-form" method="post" action="{{ liqpay_url }}" accept-charset="utf-8">
      <input type="hidden" name="data" value="{{ liqpay_data }}">
      <input type="hidden" name="signature" value="{{ liqpay_signature }}">
      <noscript>
        <button type="submit" class="btn btn--primary">Сплатити через LiqPay</button>
      </noscript>
    </form>
  </div>
</div>
<script>
  document.getElementById("liqpay-checkout-form").submit();
</script>
{% endblock %}
