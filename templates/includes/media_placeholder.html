{% comment %}

  Параметри: ratio ("1x1"|"4x3"|"16x9"|"3x4"), css_class (додаткові класи)
{% endcomment %}
<div class="ph ph--{{ ratio|default:"4x3" }} {{ css_class }}" aria-hidden="true">
  <span class="ph__icon">
    <svg width="30%" height="30%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3c-4.2 3-7 7.2-7 11.2a7 7 0 0 0 14 0C19 10.2 16.2 6 12 3Z"/>
      <path d="M12 21V9"/>
    </svg>
  </span>
</div>
