{% comment %}
  Універсальний плейсхолдер зображення (поки немає реальних фото).
  Параметри: ratio ("1x1"|"4x3"|"16x9"|"3x4"), css_class (додаткові класи)
{% endcomment %}
{% load static %}
<div class="ph ph--{{ ratio|default:"4x3" }} {{ css_class }}" aria-hidden="true">
  <img
    class="ph__img"
    src="{% static 'img/brand/placeholder-sunflower.png' %}"
    alt=""
    width="1024"
    height="807"
    loading="lazy"
    decoding="async"
  >
</div>
